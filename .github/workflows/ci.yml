name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      - name: Run ESLint
        working-directory: ./server
        run: npm run lint
      - name: Run tests
        working-directory: ./server
        run: npm test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      - name: Run ESLint
        working-directory: ./client
        run: npm run lint
      - name: Build
        working-directory: ./client
        run: npm run build
