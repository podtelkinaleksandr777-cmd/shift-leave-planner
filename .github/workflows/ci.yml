name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  structure-check:
    name: Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Checking repository structure..."
          test -f README.md && echo "✅ README.md found" || exit 1
          test -f .gitignore && echo "✅ .gitignore found" || exit 1
          test -f LICENSE && echo "✅ LICENSE found" || exit 1
          test -d client && echo "✅ client/ found" || exit 1
          test -d server && echo "✅ server/ found" || exit 1
          test -d docs && echo "✅ docs/ found" || exit 1
          echo "🎉 All structure checks passed!"
